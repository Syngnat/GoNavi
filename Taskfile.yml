version: '3'

# Wails v3 entry point. The v2 main stays available through `wails`/wails.json;
# this Taskfile drives `wails3 dev`, `wails3 build` and `wails3 package` for the
# v3 desktop app. CI uses the same tasks through scripts/ci-build-wails3-release.sh.

vars:
  APP_NAME: GoNavi
  BIN_DIR: bin
  EXE_EXT: '{{if eq OS "windows"}}.exe{{end}}'
  WAILS_VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  prebuild:
    desc: Refresh derived assets and verify the Linux toolchain
    cmds:
      - node scripts/wails-pre-build.mjs "{{OS}}/{{ARCH}}"

  dev:frontend:
    desc: Run the Vite dev server for wails3 dev
    cmds:
      - npm --prefix frontend run dev -- --port {{.WAILS_VITE_PORT}} --strictPort

  build:
    desc: Build the Wails v3 application (DEV=true skips the frontend build)
    deps:
      - prebuild
    cmds:
      - '{{if eq .DEV "true"}}go build -tags wails3 -trimpath -buildvcs=false -ldflags "-X GoNavi-Wails/internal/app.AppVersion=$(cat version/dev-version.txt) -X main.devBuild=1" -o {{.BIN_DIR}}/{{.APP_NAME}}{{.EXE_EXT}} ./cmd/wails3app{{else}}bash scripts/ci-build-wails3-release.sh "{{OS}}/{{ARCH}}" "{{.APP_NAME}}" "$(cat version/dev-version.txt)"{{end}}'

  run:
    desc: Run the last development build
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}{{.EXE_EXT}}'

  dev:
    desc: Run the v3 development loop (Vite + Go hot restart)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.WAILS_VITE_PORT}}

  package:
    desc: Build the platform artifact for the existing release packaging
    cmds:
      - task: build
