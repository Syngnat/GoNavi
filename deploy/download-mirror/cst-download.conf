# Cst serves the public download hostname on :8443 because sing-box owns :443.
# Cloudflare should proxy download.syngnat.top to this origin port.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name download.syngnat.top;

    ssl_certificate /etc/ssl/cloudflare/download.syngnat.top.pem;
    ssl_certificate_key /etc/ssl/cloudflare/download.syngnat.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/gonavi-downloads;
    access_log /var/log/nginx/gonavi-download-access.log;
    error_log /var/log/nginx/gonavi-download-error.log warn;

    client_max_body_size 1m;
    autoindex off;
    etag on;
    max_ranges 8;

    location = /healthz {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/latest/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:gonavi|drivers)/(?:dev/)?releases/download/ {
        try_files $uri =404;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404;
    }
}
