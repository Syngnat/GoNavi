[libdefaults]
 default_realm = GONAVI.TEST
 dns_lookup_kdc = false
 dns_lookup_realm = false
 rdns = false
 udp_preference_limit = 1
 ticket_lifetime = 1h
 forwardable = false

[realms]
 GONAVI.TEST = {
  kdc = kdc.gonavi.test:88
  kpasswd_server = kdc.gonavi.test:464
 }

[domain_realm]
 .gonavi.test = GONAVI.TEST
 gonavi.test = GONAVI.TEST
