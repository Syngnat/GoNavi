[kdcdefaults]
 kdc_ports = 88
 kdc_tcp_ports = 88

[realms]
 GONAVI.TEST = {
  database_name = /var/lib/gonavi-kdc/principal
  key_stash_file = /var/lib/gonavi-kdc/master.stash
  acl_file = /etc/krb5kdc/kadm5.acl
  admin_keytab = /var/lib/gonavi-kdc/kadm5.keytab
  max_life = 1h
  max_renewable_life = 2h
  supported_enctypes = aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
  default_principal_flags = +preauth
 }

[logging]
 kdc = FILE:/var/lib/gonavi-kdc/kdc.log
 admin_server = FILE:/var/lib/gonavi-kdc/kadmind.log
