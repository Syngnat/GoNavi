name: 功能建议（中文）
description: 提议新功能或改进现有能力，并提供可评估、可验收的需求信息
title: "[Enhancement] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请重点说明要解决的问题、实际使用场景和可验证的期望结果；清晰的背景比直接指定实现方式更有助于评估需求。

        **请勿提交密码、Token、完整连接串、私钥或未经脱敏的业务数据。**

  - type: checkboxes
    id: searched
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过 Issues，没有发现相同或高度相似的需求
          required: true
        - label: 我已经移除或脱敏密码、Token、连接串、私钥和业务数据
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 需求所属功能
      description: 请选择最接近的功能区域
      options:
        - 数据源连接、认证或网络
        - 数据库、Schema、表、视图、索引等对象管理
        - SQL 编辑、执行或结果集
        - 表数据浏览或编辑
        - Redis、MongoDB、消息队列、向量或搜索数据
        - 导入、导出或备份
        - SSH、代理或隧道
        - 驱动或 Driver Agent
        - AI、MCP 或 Agent
        - 安装、更新或启动
        - 界面、交互或本地设置
        - 性能或资源占用
        - 其他
    validations:
      required: true

  - type: dropdown
    id: request_type
    attributes:
      label: 需求类型
      options:
        - 新增目前不存在的功能
        - 改进现有功能或操作流程
        - 增加数据源、协议或版本兼容
        - 提升性能、稳定性或资源效率
        - 完善界面、交互或可访问性
        - 增加自动化、集成或扩展能力
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 当前使用的 GoNavi 版本
      description: 请填写“关于”页面显示的完整版本；开发构建请同时提供 commit
      placeholder: "例如：v0.9.0 / dev build (commit abc1234)"
    validations:
      required: true

  - type: input
    id: datasource
    attributes:
      label: 相关数据源及版本
      description: 涉及数据源时填写类型、服务端版本和兼容模式；与数据源无关时填写“不适用”
      placeholder: "例如：MySQL 8.0.36 / Redis 7.2 Cluster / 不适用"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与目标用户
      description: 请说明谁会在什么情况下使用该功能，以及大致使用频率
      placeholder: |
        使用者：例如 DBA、开发人员、运维人员
        使用场景：在什么任务或流程中需要该功能
        使用频率：每天多次 / 偶尔 / 特定项目阶段
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 现状与痛点
      description: 请描述目前如何完成这项工作、现有限制及其具体影响
      placeholder: |
        当前操作流程：
        遇到的限制或额外成本：
        是否存在临时替代方案，为什么仍不够用：
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能与交互
      description: 请描述期望的入口、操作流程、输入输出，以及默认值、空状态或异常状态等关键细节
      placeholder: |
        1. 从哪个页面或入口开始
        2. 用户可以执行哪些操作
        3. 应展示或产出什么结果
        4. 对默认值、权限、失败提示等有什么要求
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 请用可观察、可验证的结果描述何时可以认为需求已经完成
      placeholder: |
        - [ ] 当 ... 时，可以 ...
        - [ ] 操作完成后，应显示/生成 ...
        - [ ] 在 ... 数据量或环境下，仍能 ...
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 使用频率与影响
      description: 请选择最符合当前情况的一项，便于评估优先级
      options:
        - 阻塞核心工作，且没有可用替代方案
        - 高频重复使用，现有流程成本明显
        - 偶尔使用，希望减少操作或提升体验
        - 探索性需求，用于支持未来场景
    validations:
      required: false

  - type: textarea
    id: scale
    attributes:
      label: 数据规模或性能预期
      description: 涉及大量数据、并发、文件或长时间任务时，请提供典型值和上限；不涉及可留空
      placeholder: "例如：单表 500 万行、10 万个 Redis Key、导入文件 2 GB、期望 3 秒内完成"

  - type: dropdown
    id: compatibility
    attributes:
      label: 对现有行为的影响
      description: 说明该需求是否需要改变已有默认行为或数据格式
      options:
        - 仅新增能力，不改变现有行为
        - 需要调整现有行为，但应保持向后兼容
        - 可能包含不兼容变更
        - 暂不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可填写目前使用的临时方案、其他客户端的实现方式，以及未采用这些方案的原因
      placeholder: 可选

  - type: textarea
    id: references
    attributes:
      label: 原型、截图或参考资料
      description: 可直接拖入原型、截图或录屏，也可提供相关文档和同类产品链接；请先脱敏
      placeholder: 可选

  - type: checkboxes
    id: pr
    attributes:
      label: 是否愿意提交 PR 实现当前 Issue
      options:
        - label: 我愿意尝试提交 PR
