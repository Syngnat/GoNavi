name: Dev Build

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build windows/amd64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UPX
        shell: pwsh
        run: |
          $UPX_VERSION = "4.2.4"
          $url = "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-win64.zip"
          $zipPath = "$env:RUNNER_TEMP\upx.zip"
          $extractPath = "$env:RUNNER_TEMP\upx"
          Invoke-WebRequest -Uri $url -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $upxDir = Get-ChildItem -Path $extractPath -Directory | Select-Object -First 1
          "$($upxDir.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $upxCmd = Join-Path $upxDir.FullName "upx.exe"
          if (!(Test-Path $upxCmd)) {
            Write-Error "UPX not found"
            exit 1
          }
          & $upxCmd --version

      - name: Install Wails
        run: go install -v github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Setup MSYS2 Toolchain For DuckDB
        id: msys2_duckdb
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Configure DuckDB CGO Toolchain
        shell: pwsh
        run: |
          function Find-MingwBin([string[]]$candidates) {
            foreach ($bin in $candidates) {
              if ([string]::IsNullOrWhiteSpace($bin)) {
                continue
              }
              $gcc = Join-Path $bin 'gcc.exe'
              $gxx = Join-Path $bin 'g++.exe'
              if ((Test-Path $gcc) -and (Test-Path $gxx)) {
                return $bin
              }
            }
            return $null
          }

          $msys2Outcome = "${{ steps.msys2_duckdb.outcome }}"
          $msys2Location = "${{ steps.msys2_duckdb.outputs['msys2-location'] }}"
          $candidateBins = @()
          if (-not [string]::IsNullOrWhiteSpace($msys2Location)) {
            $candidateBins += Join-Path $msys2Location 'ucrt64\bin'
          }
          $candidateBins += @(
            'C:\msys64\ucrt64\bin',
            'D:\a\_temp\msys64\ucrt64\bin'
          )
          $candidateBins = @($candidateBins | Select-Object -Unique)

          $mingwBin = Find-MingwBin $candidateBins
          if (-not $mingwBin) {
            if ($msys2Outcome -ne 'success') {
              Write-Warning "MSYS2 setup did not complete successfully, falling back to local path probing"
            } else {
              Write-Warning "MSYS2 finished but UCRT64 gcc/g++ was not found, falling back to local path probing"
            }
            $mingwBin = Find-MingwBin $candidateBins
          }

          if (-not $mingwBin) {
            Write-Error "DuckDB UCRT64 toolchain not found. Checked: $($candidateBins -join ', ')"
            exit 1
          }

          $gcc = Join-Path $mingwBin 'gcc.exe'
          $gxx = Join-Path $mingwBin 'g++.exe'

          if (!(Test-Path $gcc) -or !(Test-Path $gxx)) {
            Write-Error "DuckDB toolchain incomplete: gcc=$gcc g++=$gxx"
            exit 1
          }

          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$gxx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify DuckDB CGO Toolchain
        shell: pwsh
        run: |
          & "$env:CC" --version
          & "$env:CXX" --version

      - name: Generate Dev Version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEV_VERSION="dev-${SHORT_SHA}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Dev version: ${DEV_VERSION}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          DEV_VERSION="${{ steps.version.outputs.version }}"
          wails build -platform windows/amd64 -clean -o gonavi-build-windows-amd64 -ldflags "-s -w -X GoNavi-Wails/internal/app.AppVersion=${DEV_VERSION}"

      - name: Build Optional Driver Agents
        shell: bash
        run: |
          set -euo pipefail
          GOOS="windows"
          GOARCH="amd64"
          DRIVERS=(mariadb doris sphinx sqlserver sqlite duckdb dameng kingbase highgo vastbase mongodb tdengine clickhouse)
          OUTDIR="drivers/Windows"
          mkdir -p "$OUTDIR"

          for DRIVER in "${DRIVERS[@]}"; do
            BUILD_DRIVER="$DRIVER"
            if [ "$DRIVER" = "doris" ]; then
              BUILD_DRIVER="diros"
            fi

            TAG="gonavi_${BUILD_DRIVER}_driver"
            OUTPUT="${DRIVER}-driver-agent-${GOOS}-${GOARCH}.exe"
            OUTPUT_PATH="${OUTDIR}/${OUTPUT}"
            echo "Building ${OUTPUT_PATH} (tag=${TAG})"

            if [ "$DRIVER" = "duckdb" ]; then
              CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -tags "${TAG}" \
                -trimpath \
                -ldflags "-s -w" \
                -o "${OUTPUT_PATH}" \
                ./cmd/optional-driver-agent
            else
              CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
                -tags "${TAG}" \
                -trimpath \
                -ldflags "-s -w" \
                -o "${OUTPUT_PATH}" \
                ./cmd/optional-driver-agent
            fi
          done

      - name: Package Windows EXE
        shell: pwsh
        run: |
          Set-Location build/bin
          $version = "${{ steps.version.outputs.version }}"
          $target = "gonavi-build-windows-amd64"
          $finalExeName = "GoNavi-$version-Windows-Amd64.exe"

          if (Test-Path "$target.exe") {
            $finalExe = "$target.exe"
          } elseif (Test-Path "$target") {
            Rename-Item -Path "$target" -NewName "$target.exe"
            $finalExe = "$target.exe"
          } else {
            Write-Error "Build output '$target' not found"
            exit 1
          }

          $upxCmd = Get-Command upx -ErrorAction SilentlyContinue
          if ($null -eq $upxCmd) {
            Write-Error "UPX not found"
            exit 1
          }

          & upx --best --lzma --force $finalExe | Out-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Error "UPX compression failed"
            exit 1
          }

          & upx -t $finalExe | Out-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Error "UPX verification failed"
            exit 1
          }

          Copy-Item -LiteralPath $finalExe -Destination "..\\..\\$finalExeName" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-artifacts-windows-amd64
          path: |
            GoNavi-*.exe
            drivers/**
          retention-days: 7

  release:
    name: Publish Dev Pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dev-build-artifacts-*
          merge-multiple: true

      - name: List Assets
        run: ls -R release-assets

      - name: Package Driver Agents Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if [ ! -d drivers ]; then
            echo "No drivers directory found, skipping bundle"
            exit 0
          fi
          if [ -z "$(find drivers -type f 2>/dev/null | head -n 1)" ]; then
            echo "Drivers directory is empty, skipping bundle"
            rm -rf drivers
            exit 0
          fi

          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          out_name = "GoNavi-DriverAgents.zip"
          index_name = "GoNavi-DriverAgents-Index.json"
          base = Path("drivers")
          out_path = Path(out_name)
          index_path = Path(index_name)
          if out_path.exists():
              out_path.unlink()
          if index_path.exists():
              index_path.unlink()

          size_index = {}
          with zipfile.ZipFile(out_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for p in base.rglob("*"):
                  if not p.is_file():
                      continue
                  arcname = p.relative_to(base).as_posix()
                  zf.write(p, arcname)
                  size_index[p.name] = p.stat().st_size

          index_path.write_text(
              json.dumps({"assets": size_index}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          rm -rf drivers

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          FILES=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FILES+=("$file")
            fi
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            : > SHA256SUMS
          else
            sha256sum "${FILES[@]}" > SHA256SUMS
          fi

      - name: Generate Dev Version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DEV_VERSION="dev-${SHORT_SHA}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Format Build Time
        id: build_time
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta

          raw = "${{ github.event.head_commit.timestamp }}"
          dt = datetime.fromisoformat(raw)
          china_tz = timezone(timedelta(hours=8))
          formatted = dt.astimezone(china_tz).strftime("%Y-%m-%d %H:%M:%S")
          print(f"display={formatted}")
          PY

      - name: Reset Previous Dev Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = 'dev-latest';
            const ref = `tags/${tag}`;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const matchedReleases = releases.filter((release) => release.tag_name === tag);
            for (const release of matchedReleases) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Create Dev Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev Build (${{ steps.version.outputs.version }})"
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          prerelease: true
          draft: false
          body: |
            ## Dev Build

            **Version**: `${{ steps.version.outputs.version }}`
            **Branch**: `dev`
            **Commit**: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Build Time**: ${{ steps.build_time.outputs.display }}

            This is a development pre-release for packaging verification on `dev`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
