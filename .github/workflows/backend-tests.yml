name: Backend Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full:
    name: Full backend suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare frontend embed
        shell: bash
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>GoNavi test</title>\n' > frontend/dist/index.html
          cp tools/stub-dist.tar.br frontend/dist.tar.br

      - name: Install Wails Linux build dependencies
        # assets_prod_test.go 引入 wails/v2/pkg/assetserver，linux 上经
        # assetserver_webview.go 无条件依赖 webkit2gtk CGO，缺少时根包
        # 测试构建直接失败。ubuntu-24.04 起 libwebkit2gtk-4.0-dev 已移除，
        # 安装 4.1 开发包并配合 webkit2_41 构建标签（wails v2.11 原生支持）。
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run backend tests
        run: go test -tags webkit2_41 ./... -count=1 -timeout=30m

      # DuckDB 附加模块带 gonavi_duckdb_driver 构建标签（需 CGO），主套件
      # 的 webkit2_41 标签不编译这批文件；单独跑一遍防止无覆盖回归。
      - name: Run DuckDB driver tests
        env:
          CGO_ENABLED: 1
        run: go test -tags gonavi_duckdb_driver ./internal/db/ ./internal/app/ -run 'DuckDB|Attach|Slugify|SavedConnection|ConnectionSecret|BuildDuckDB|SameExternal|ParseDuckDB|SecretCleanup' -count=1 -timeout=30m

      # Kafka、RocketMQ、Pulsar 改为驱动代理后带各自的构建标签，主套件不再编译这批
      # 文件；单独跑一遍保留原有覆盖。
      - name: Run message queue driver tests
        run: go test -tags gonavi_kafka_driver,gonavi_rocketmq_driver,gonavi_pulsar_driver ./internal/db/ -count=1 -timeout=30m

  platform-sensitive:
    name: Platform-sensitive tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test AI file errors
        run: go test ./internal/ai/service -run '^TestMCPClientInstallConfigIOFailuresUseServiceLanguage$' -count=1

      - name: Test Claude CLI timing
        run: go test ./internal/ai/provider -run '^TestClaudeCLIProvider_(ChatStreamUsesRequestTimeoutWhenNoMeaningfulResponseArrives|ChatStreamAllowsDelayedMeaningfulResponse)$' -count=1

      - name: Test JVM fixtures
        run: go test ./internal/jvm -run '^(TestAgentProviderRealAgentRoundTrip|TestHTTPProviderRealEndpointRoundTrip|TestJMXProviderRealJMXRoundTrip)$' -count=1 -timeout=5m

      - name: Test optional driver-agent cleanup
        run: go test ./internal/db -run '^TestOptionalDriverAgentUnresponsiveProcessIsReapedAfterTimeout$' -count=1
