name: Deploy Download Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gonavi-download-dispatcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/download-dispatcher
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/download-dispatcher/package-lock.json

      - name: Install and verify dispatcher
        run: |
          npm ci
          npm run check

      - name: Apply production bindings
        env:
          ROUTING_STATE_KV_ID: ${{ vars.ROUTING_STATE_KV_ID }}
        run: |
          set -euo pipefail
          [[ "${ROUTING_STATE_KV_ID}" =~ ^[0-9a-f]{32}$ ]] || { echo "ROUTING_STATE_KV_ID is invalid" >&2; exit 1; }
          jq \
            --arg kv "${ROUTING_STATE_KV_ID}" \
            '.kv_namespaces[0].id = $kv' \
            wrangler.jsonc > wrangler.production.jsonc

      - name: Deploy dispatcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc
