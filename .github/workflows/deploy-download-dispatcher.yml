name: Deploy Download Dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gonavi-download-dispatcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/download-dispatcher
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/download-dispatcher/package-lock.json

      - name: Install and verify dispatcher
        run: |
          npm ci
          npm run check

      - name: Deploy dispatcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
